<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sketch to Mark</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <header class="bar">
      <h1>Sketch to Mark</h1>
      <nav class="tabs" aria-label="Tools">
        <button class="tab" type="button" data-view="app" aria-pressed="true">Logo</button>
        <button id="icon-tab" class="tab" type="button" data-view="icon-app" aria-pressed="false" disabled>Icon</button>
      </nav>
      <div class="bar-actions">
        <label class="button primary">
          Open photo
          <input id="file" type="file" accept="image/*" hidden />
        </label>
        <button id="sample" class="button" type="button">Try a sample</button>
      </div>
    </header>

    <main id="app" class="empty">
      <section class="intro" id="intro">
        <p>Drop a photo of a drawing anywhere on this page, paste one, or open a file.</p>
        <p class="quiet">Everything happens in this browser. Nothing is uploaded.</p>
      </section>

      <aside class="controls" aria-label="Settings">
        <fieldset>
          <legend>1 · Paper</legend>
          <p class="hint">Drag the corners onto the sheet's corners.</p>
          <div class="row">
            <button id="detect" class="button small" type="button">Find the sheet</button>
            <button id="whole" class="button small" type="button">Use whole photo</button>
          </div>
        </fieldset>

        <fieldset>
          <legend>2 · Ink</legend>
          <label class="slider">
            <span>Even out light <output id="flatten-out"></output></span>
            <input id="flatten" type="range" min="0" max="1" step="0.05" value="0.9" />
          </label>
          <label class="slider">
            <span>Ink cut-off <output id="level-out"></output></span>
            <input id="level" type="range" min="1" max="254" step="1" value="128" />
          </label>
          <label class="check"><input id="level-auto" type="checkbox" checked /> Pick the cut-off for me</label>
          <label class="slider">
            <span>Line weight <output id="weight-out"></output></span>
            <input id="weight" type="range" min="-3" max="3" step="1" value="0" />
          </label>
          <label class="slider">
            <span>Remove specks under <output id="speck-out"></output></span>
            <input id="speck" type="range" min="0" max="400" step="5" value="40" />
          </label>
          <label class="slider">
            <span>Trim edges <output id="trim-out"></output></span>
            <input id="trim" type="range" min="0" max="0.08" step="0.005" value="0.015" />
          </label>
          <label class="slider">
            <span>Space around <output id="pad-out"></output></span>
            <input id="pad" type="range" min="0" max="200" step="4" value="32" />
          </label>
        </fieldset>

        <fieldset>
          <legend>3 · Vector</legend>
          <label class="slider">
            <span>Smoothness <output id="smooth-out"></output></span>
            <input id="smooth" type="range" min="0" max="1.33" step="0.01" value="1" />
          </label>
          <label class="slider">
            <span>Simplify curves <output id="simplify-out"></output></span>
            <input id="simplify" type="range" min="0" max="1.5" step="0.05" value="0.2" />
          </label>
          <div class="row">
            <label class="swatch">Ink <input id="ink" type="color" value="#1d1a24" /></label>
            <label class="swatch">Background <input id="bg" type="color" value="#ffffff" /></label>
            <label class="check"><input id="bg-on" type="checkbox" /> Fill</label>
          </div>
        </fieldset>

        <fieldset>
          <legend>Export</legend>
          <div class="row">
            <button id="dl-svg" class="button primary small" type="button">Download SVG</button>
            <button id="copy-svg" class="button small" type="button">Copy SVG</button>
            <button id="dl-png" class="button small" type="button">Download PNG</button>
          </div>
          <p class="stats" id="stats" aria-live="polite"></p>
        </fieldset>
      </aside>

      <section class="pane" aria-label="Photo">
        <h2>Photo</h2>
        <div class="stage" id="photo-stage">
          <canvas id="photo"></canvas>
          <svg id="handles" aria-label="Sheet corners"></svg>
        </div>
      </section>

      <section class="pane" aria-label="Result">
        <div class="pane-head">
          <h2>Result</h2>
          <div class="toggle" role="radiogroup" aria-label="Show">
            <label><input type="radio" name="view" value="vector" checked /> Vector</label>
            <label><input type="radio" name="view" value="ink" /> Ink</label>
            <label><input type="radio" name="view" value="flat" /> Straightened</label>
          </div>
        </div>
        <div class="stage checker" id="result-stage">
          <canvas id="ink-view" hidden></canvas>
          <canvas id="flat-view" hidden></canvas>
          <div id="vector-view"></div>
        </div>
      </section>
    </main>

    <main id="icon-app" class="icon-app" hidden>
      <aside class="controls" aria-label="Icon style">
        <fieldset>
          <legend>Style</legend>
          <div class="row">
            <select id="style-pick" aria-label="Style"></select>
            <button id="style-save" class="button small" type="button">Save as…</button>
            <button id="style-delete" class="button small" type="button">Delete</button>
          </div>
          <div class="row">
            <button id="style-export" class="button small" type="button">Export style</button>
            <label class="button small">Import style <input id="style-import" type="file" accept="application/json,.json" hidden /></label>
            <button id="style-reset" class="button small" type="button">Reset</button>
          </div>
          <p class="hint" id="style-state"></p>
          <label class="field">Icon name <input id="icon-name" type="text" spellcheck="false" /></label>
        </fieldset>
        <div id="style-fields"></div>
        <fieldset>
          <legend>Export</legend>
          <div class="row">
            <button id="dl-pack" class="button primary small" type="button">Download icon pack</button>
            <button id="dl-sprite" class="button small" type="button">Download sprite</button>
            <button id="copy-head" class="button small" type="button">Copy &lt;head&gt; tags</button>
          </div>
          <p class="stats" id="icon-stats" aria-live="polite"></p>
        </fieldset>
      </aside>

      <section class="icon-preview">
        <div class="pane">
          <h2>Small sizes</h2>
          <div class="sizes" id="sizes"></div>
        </div>
        <div class="pane">
          <h2>Family</h2>
          <div class="family" id="family"></div>
        </div>
      </section>
    </main>

    <div id="drop" class="drop" hidden>Drop the photo</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
